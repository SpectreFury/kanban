services: 
  db: 
    image: postgres:latest
    container_name: local_postgres 
    restart: always
    environment:
      POSTGRES_USER: spectrefury
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
